<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Cadastro recebido — AquariOS</title>

    <!-- Google Analytics 4 + Google Ads (frente "Google" do patrocinado) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KVWTTDFSF6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KVWTTDFSF6');
      gtag('config', 'AW-XXXXXXXXX');
      // Evento de conversão real do Google Ads — SUBSTITUIR AW-XXXXXXXXX/YYYYYYYYYY
      // pelo par ID/label que a ação de conversão gera (Google Ads → Conversões →
      // Nova ação → Site → "Ver instruções da tag" → snippet de evento).
      gtag('event', 'conversion', {'send_to': 'AW-XXXXXXXXX/YYYYYYYYYY'});
    </script>

    <!-- Meta Pixel (frente "Meta": Instagram + Facebook + WhatsApp Ads) -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', 'SEU_PIXEL_ID');
      fbq('track', 'PageView');
      fbq('track', 'Lead');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=SEU_PIXEL_ID&ev=Lead&noscript=1"
    /></noscript>

    <style>
        :root { --bg: #EDEAE4; --hero: #1A1F2E; --card: #FFFFFF; --primary: #7C5CBF; --text: #1A1F2E; --text-muted: rgba(26,31,46,0.55); --border: rgba(26,31,46,0.08); }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 2rem;
            font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px;
            padding: 3rem 2.5rem; max-width: 460px; text-align: center; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.75rem; letter-spacing: -0.01em; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.75rem; }
        a.btn { display: inline-block; background: var(--primary); color: #fff; text-decoration: none;
            font-weight: 700; font-size: 0.9rem; padding: 0.85rem 1.75rem; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🌱</div>
        <h1>Recebemos seu cadastro.</h1>
        <p>Você acabou de dar o primeiro passo pra ser um Beta Fundador do AquariOS. Em breve
        entramos em contato — de olho na sua caixa de entrada (e no spam, por garantia).</p>
        <a class="btn" href="https://podiumtec.com.br">← Voltar ao site</a>
    </div>
</body>
</html>
