# Security headers — incluir no server{} do nginx da VM Oracle (api.podiumtec.com.br)
#   include /etc/nginx/snippets/security_headers.conf;
# Alvo: Mozilla Observatory A / SSL Labs A+ / HSTS Preload.
# ⚠️ Deploy gated: aplicar na sessão presencial (nginx -t && systemctl reload nginx).

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP restritiva — API pura não serve HTML; se servir páginas, revisar antes.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
