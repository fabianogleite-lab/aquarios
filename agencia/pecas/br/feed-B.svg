<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#1A1F2E"/>

  <!-- Wordmark -->
  <text x="80" y="120" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="6" fill="#FFFFFF">AQUARIOS</text>

  <!-- iVi ring (Físico / Mental / Espiritual / Social) + Estrela no núcleo -->
  <g transform="translate(920,170)">
    <path d="M 0,-90 A 90 90 0 0 1 90,0"   fill="none" stroke="#E07B54" stroke-width="20" stroke-linecap="round"/>
    <path d="M 90,0 A 90 90 0 0 1 0,90"    fill="none" stroke="#5B8DEF" stroke-width="20" stroke-linecap="round"/>
    <path d="M 0,90 A 90 90 0 0 1 -90,0"   fill="none" stroke="#7C5CBF" stroke-width="20" stroke-linecap="round"/>
    <path d="M -90,0 A 90 90 0 0 1 0,-90"  fill="none" stroke="#52C98A" stroke-width="20" stroke-linecap="round"/>
    <path d="M 0,-34 L 8.2,-11.3 L 32.3,-10.5 L 13.3,4.3 L 20,27.5 L 0,14 L -20,27.5 L -13.3,4.3 L -32.3,-10.5 L -8.2,-11.3 Z" fill="#EDEAE4"/>
  </g>

  <!-- Headline -->
  <text x="80" y="400" font-family="Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">
    <tspan x="80" dy="0">Você tem um score de</tspan>
    <tspan x="80" dy="84">vitalidade.</tspan>
  </text>

  <!-- Body -->
  <text x="80" y="640" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="400" fill="#C4BDB6">
    <tspan x="80" dy="0">iVi: um único número, em tempo real, integrando</tspan>
    <tspan x="80" dy="48">físico, mental, espiritual e social. Sem gráficos</tspan>
    <tspan x="80" dy="48">soltos, sem ruído — e com um diário que nem a nossa IA</tspan>
    <tspan x="80" dy="48">consegue ler.</tspan>
  </text>

  <!-- CTA pill -->
  <g transform="translate(80,912)">
    <rect width="759" height="88" rx="44" fill="#7C5CBF"/>
    <text x="48" y="58" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Descubra seu iVi → grátis, sem cartão</text>
  </g>

  <!-- Brasil / pt-BR / variante B -->
</svg>
